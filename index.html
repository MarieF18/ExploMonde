<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ExploMonde</title>
        <link rel="stylesheet" href="css/token.css" />
        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/components.css" />
    </head>
    <body>
        <a class="skip-link" href="#contenu-principal">Aller au contenu principal</a>
        <header>
            <h1>Bienvenue sur ExploMonde!</h1>
            <nav>
            </nav>
        </header>
        
        <main id="contenu-principal" tabindex="-1">
            <section class="recherche">
                <h2>Champs de Recherche</h2>
                <label for="recherche-pays">Rechercher un pays</label>
                <input id="recherche-pays" type="text" placeholder="Rechercher..." />
                <label for="filtre-region">Filtrer par région</label>
                <select id="filtre-region">
                    <option value="">Toutes les régions</option>
                </select>
                <button>Rechercher</button>
                <p id="statut-resultats" role="status" aria-live="polite"></p>
            </section>
            <section class="resultats">
                <h2>Résultats de la Recherche</h2>
                <div id="cartes-pays"></div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 ExploMonde. Marie Fiette.</p>
        </footer>
        <dialog id="detail-pays">
            <h2 id="titre-detail"></h2>
            <div id="contenu-detail"></div>
            <form method="dialog">
                <button>Fermer</button>
            </form>
        </dialog>
        <script type="module" src="js/main.js"></script>
    </body>
</html>
